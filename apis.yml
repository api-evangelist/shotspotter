aid: shotspotter
name: ShotSpotter (SoundThinking)
description: 'ShotSpotter is the flagship acoustic gunshot detection service of SoundThinking, Inc.
  (Nasdaq: SSTI), the public safety technology company formerly named ShotSpotter, Inc. SoundThinking
  operates a portfolio of law-enforcement and security products including ShotSpotter gunfire detection,
  SafePointe AI weapons detection, PlateRanger license-plate recognition, CrimeTracer investigative
  search, CaseBuilder case management, and ResourceRouter patrol analytics. Developers integrate via the
  SoundThinking developer documentation at docs.soundthinking.com, which publishes REST data APIs for
  ShotSpotter (incident data, CAD incident ID, ILS) and SafePointe (alert data, line-crossing data), plus
  NAPI, a webhook/push notification interface that delivers real-time XML alert documents (ShotSpotter
  IALRT incident presentations and SafePointe SPALRT alerts) to a customer network endpoint, alongside an
  Applications IT Resource Guide.'
